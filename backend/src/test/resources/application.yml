spring:
  application:
    name: virtual-furniture-store-test
  datasource:
    url: jdbc:h2:mem:furniture_store_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

app:
  jwt:
    secret: d2FybS13YWxudXQtZnVybml0dXJlLXNlY3JldC1rZXktYXV0aC1zZXJ2aWNlLTIwMjY=
    expiration-ms: 3600000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: http://localhost:3000

logging:
  level:
    com.furniture.store: DEBUG
    org.springframework.security: INFO
