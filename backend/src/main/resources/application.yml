server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: virtual-furniture-store
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true

# Security / JWT Defaults
app:
  jwt:
    secret: ${JWT_SECRET:d2FybS13YWxudXQtZnVybml0dXJlLXNlY3JldC1rZXktYXV0aC1zZXJ2aWNlLTIwMjY=}
    expiration-ms: ${JWT_EXPIRATION:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000,http://localhost:3001}

# Observability & Health Monitoring (TICKET-039)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      simple:
        enabled: true

# Structured Logging with MDC Request ID
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [req:%X{requestId:-none}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [req:%X{requestId:-none}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.furniture.store: INFO
    org.springframework.web: INFO

# SpringDoc / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
