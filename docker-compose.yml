services:
  # PostgreSQL Database Service (System of Record)
  postgres:
    image: postgres:16-alpine
    container_name: furniture-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: furniture_store
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # MySQL Database Service (Alternative Relational Option)
  mysql:
    image: mysql:8.0
    container_name: furniture-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: furniture_store
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # MongoDB Service for Spatial/Visualization Sessions
  mongodb:
    image: mongo:7.0
    container_name: furniture-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # MinIO (Local S3-Compatible Object Storage)
  minio:
    image: minio/minio:latest
    container_name: furniture-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  mysql_data:
  mongo_data:
  minio_data:
